version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      test-and-tool-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      production-patch-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
