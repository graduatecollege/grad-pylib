[project]
name = "grad-pylib"
description = "Internal core helpers and wrappers for FastAPI backends"
authors = [
    { name = "Mikael Arvola", email = "marvel@illinois.edu" },
]
license-files = [
    "LICENSE", "NOTICE"
]
dynamic = [
    "version"
]
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "fastapi-azure-auth==5.3.0",
    "pydantic-settings==2.15.0",
    "pyodbc==5.3.0",
    "httptools==0.8.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "httpx2==2.12.0",
    "testcontainers[mssql]==4.15.0",
    "pymssql==2.3.13",
    "pytest-cov==7.1.0",
]
dev = [
    "sqlacodegen==4.0.4",
    "pymssql==2.3.13",
    "ty==0.0.74",
    "ruff==0.16.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "httpx2==2.12.0",
    "testcontainers[mssql]==4.15.0",
    "pymssql==2.3.13",
    "pytest-cov==7.1.0",
]
dev = [
    "sqlacodegen==4.0.4",
    "pymssql==2.3.13",
    "ty==0.0.74",
    "ruff==0.16.4",
]

[tool.uv]
default-groups = ["dev", "test"]

[project.scripts]
migrate = "grad_pylib.tools.migrate:main"
openapi = "grad_pylib.tools.export_openapi:main"
generate-models = "grad_pylib.tools.generate_models:main"
rebuild-models = "grad_pylib.tools.rebuild_models:main"
extract-codebook = "grad_pylib.tools.extract_codebook:main"

[project.urls]
Source = "https://github.com/graduatecollege/grad-pylib"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/grad_pylib"]

[tool.pytest.ini_options]
addopts = "-n 3 --dist loadfile"
pythonpath = ["src/grad_pylib"]
testpaths = ["src/grad_pylib"]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers",
]


[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Instead of tag_filter/tag_regex variables, explicitly tell Git how to search tags:
git_describe_command = "git describe --dirty --tags --long --match 'v*'"


[tool.ruff.lint]
select = [
    "FAST",
    "ANN001",
    "ANN002",
    "ASYNC",
    "SIM",
    "UP"
]

[tool.ruff]
extend-exclude = ["src/data/generated/models.py"]
